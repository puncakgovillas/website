name = "website"
main = "worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/photos/*", "/", "/villa", "/villa/*", "/villa-*", "/sewa-villa-*", "/sitemap.xml", "/robots.txt"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "puncakgovillas-data"

# Tiap hari jam 03:00 WIB: hapus foto villa yang ditolak > 30 hari
[triggers]
crons = ["0 20 * * *"]
